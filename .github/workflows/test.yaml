name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        cache: 'pip'
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade "pip>=25.3" "setuptools<81" wheel
        python -m pip install --build-constraint .github/ci-build-constraints.txt -r requirements.txt
        python -m pip install --build-constraint .github/ci-build-constraints.txt -e .

        # Install FFmpeg
        sudo apt-get -y update
        sudo apt-get install -y ffmpeg

    - name: Create Testing Environment
      run: |
        cp .env.example .env

    - name: Test with PyTest
      run: |
        python -m pytest

  lint_python:
    name: Lint Pyton files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install flake8

    - name: Run flake8
      run: |
        flake8 . --count --max-complexity=20 --max-line-length=127 --statistics --exclude venv

  lint_ts:
    name: Lint Typescript files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
    - uses: pnpm/action-setup@v2
      with:
        version: '7.33.7'

    - name: Install Modules
      run: |
        cd web-ui && pnpm install

    - name: Run eslint
      run: cd web-ui && npm run lint
